<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>バーコード / QR 同一モード読み取りデモ</title>
<style>
  :root{
    --bg:#0f1724;
    --panel:#0b1220;
    --text:#e6eef8;
    --muted:#9fb0c8;
    --accent:#60a5fa;
  }
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:980px;margin:24px auto;padding:20px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;box-shadow:0 6px 30px rgba(2,6,23,0.6)}
  h1{margin:0 0 12px;font-size:18px}
  .grid{display:grid;grid-template-columns:1fr 360px;gap:16px}
  .video-container{position:relative;border-radius:8px;overflow:hidden;background:#000;min-height:360px;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:cover;background:#000}
  .controls{display:flex;flex-direction:column;gap:12px;padding:8px}
  .control-row{display:flex;gap:8px;align-items:center}
  label{font-size:13px;color:var(--muted)}
  select, button, .result-box{width:100%}
  select,button{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);font-size:14px}
  button.primary{background:var(--accent);border:none;color:#04233b;font-weight:600}
  .result{background:#061428;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);min-height:80px;display:flex;flex-direction:column;gap:6px}
  .detected-text{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Noto Sans Mono", monospace;background:#031021;padding:8px;border-radius:6px;color:#bfe8ff;word-break:break-all}
  .meta{font-size:12px;color:var(--muted)}
  .small{font-size:13px;color:var(--muted)}
  footer{margin-top:12px;font-size:12px;color:var(--muted)}
  /* レスポンシブ */
  @media (max-width:880px){
    .grid{grid-template-columns:1fr; }
    .controls{order:2}
  }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <h1>バーコード &amp; QR 同時読み取り（分割モードなし）</h1>
    <div class="grid">
      <div>
        <div class="video-container" id="videoWrapper">
          <video id="video" playsinline autoplay muted></video>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="startBtn" class="primary">読み取り開始</button>
          <button id="stopBtn">停止</button>
          <button id="switchBtn">カメラ切替</button>
        </div>
      </div>

      <aside class="controls" aria-label=" controls ">
        <div class="control-row">
          <label for="deviceSelect">カメラ選択</label>
        </div>
        <div class="control-row">
          <select id="deviceSelect" aria-label="camera select"></select>
        </div>

        <div class="control-row">
          <label class="small">検出中の値</label>
        </div>
        <div class="result">
          <div class="meta">最新検出（リアルタイム）</div>
          <div id="detected" class="detected-text">— まだ検出されていません —</div>
          <div class="meta" id="formatInfo">フォーマット: —</div>
        </div>

        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="confirmBtn" class="primary">解析確定</button>
          <button id="copyBtn">コピー</button>
        </div>

        <div style="margin-top:10px">
          <div class="meta">ヒント: このモードはバーコードもQRも両方検出します。分割ボタンはありません（仕様変更）。</div>
        </div>
      </aside>
    </div>

    <footer>
      <div>実装: ネイティブ <code>BarcodeDetector</code> を優先し、未対応ブラウザでは ZXing ライブラリにフォールバックします。</div>
    </footer>
  </div>

<script>
/*
  システム概要（日本語コメント）
  - BarcodeDetector API が使える場合はそれを使って連続検出
  - 使えない場合は ZXing の BrowserMultiFormatReader を動的読み込みして利用
  - カメラ選択、カメラ切替（deviceId を巡回）、開始・停止、解析確定（確定ボタンで外向け処理）
  - 赤い読み取り用UI（オーバーレイ）は出さない（ユーザー要望）
  - 既知のフォーマットは自動判定して表示（formatInfo）
*/

let video = document.getElementById('video');
let deviceSelect = document.getElementById('deviceSelect');
let detectedEl = document.getElementById('detected');
let formatInfoEl = document.getElementById('formatInfo');
let startBtn = document.getElementById('startBtn');
let stopBtn = document.getElementById('stopBtn');
let switchBtn = document.getElementById('switchBtn');
let confirmBtn = document.getElementById('confirmBtn');
let copyBtn = document.getElementById('copyBtn');

let currentStream = null;
let currentDeviceId = null;
let devices = [];
let scanning = false;

let barcodeDetector = null; // ネイティブ API 用
let zxingReader = null;     // ZXing 用 fallback reader
let zxingLoaded = false;
let zxingScriptLoaded = false;
let zxingModuleUrl = 'https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js'; // フォールバック先（必要であれば変更）

// 最新検出データ（UI 表示用）
let latestDetection = { text: null, format: null, raw: null };

// 初期化
async function init() {
  await enumerateCameras();
  attachUI();
  // BarcodeDetector が使えるか確認
  if ('BarcodeDetector' in window) {
    try{
      const supported = await window.BarcodeDetector.getSupportedFormats();
      // supported が空配列でも try してみる（ブラウザ実装差があるため）
      barcodeDetector = new window.BarcodeDetector({formats: supported.length ? supported : [
        'qr_code','code_128','code_39','code_93','ean_13','ean_8','itf','codabar','upc_e','upc_a'
      ]});
      console.log('BarcodeDetector ready', barcodeDetector);
    }catch(e){
      console.warn('BarcodeDetector initialisation failed', e);
      barcodeDetector = null;
    }
  } else {
    console.log('BarcodeDetector not available; will use ZXing fallback');
  }
}

// カメラ列挙
async function enumerateCameras(){
  try {
    const devicesList = await navigator.mediaDevices.enumerateDevices();
    devices = devicesList.filter(d => d.kind === 'videoinput');
    deviceSelect.innerHTML = '';
    devices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      // device.label はカメラ許可前は空文字のことがある
      opt.text = d.label || `カメラ ${i+1}`;
      deviceSelect.appendChild(opt);
    });
    if (devices.length > 0) {
      currentDeviceId = devices[0].deviceId;
      deviceSelect.value = currentDeviceId;
    }
  } catch (err) {
    console.error('enumerateDevices error', err);
  }
}

// カメラ開始
async function startCamera(deviceId){
  stopCamera();
  const constraints = {
    audio: false,
    video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' }
  };
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    // video 要素にセット
    video.srcObject = currentStream;
    await video.play();
    scanning = true;
    // 検出ループ開始
    startDetectionLoop();
  } catch (err) {
    console.error('getUserMedia error', err);
    alert('カメラにアクセスできません: ' + (err && err.message || err));
  }
}

// カメラ停止
function stopCamera(){
  scanning = false;
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  // ZXing の場合は Reader 停止
  if (zxingReader && typeof zxingReader.reset === 'function') {
    try { zxingReader.reset(); } catch(e){/* ignore */ }
  }
}

// カメラ切替（deviceSelect の選択を巡回）
function switchCamera(){
  if (devices.length <= 1) return;
  const idx = devices.findIndex(d => d.deviceId === currentDeviceId);
  const nextIdx = (idx + 1) % devices.length;
  currentDeviceId = devices[nextIdx].deviceId;
  deviceSelect.value = currentDeviceId;
  startCamera(currentDeviceId);
}

// UI イベント紐付け
function attachUI(){
  startBtn.addEventListener('click', async () => {
    if (!currentDeviceId && devices.length>0) currentDeviceId = devices[0].deviceId;
    await startCamera(currentDeviceId);
  });
  stopBtn.addEventListener('click', () => stopCamera());
  switchBtn.addEventListener('click', () => switchCamera());
  deviceSelect.addEventListener('change', (e) => {
    currentDeviceId = e.target.value;
    startCamera(currentDeviceId);
  });
  confirmBtn.addEventListener('click', () => {
    // 解析確定: 最新の検出結果を確定処理（必要ならここでサーバ送信や別UIに渡す）
    if (!latestDetection.text) {
      alert('検出結果がありません。まずはカメラを開始して読み取ってください。');
      return;
    }
    // ここを必要に応じて書き換え
    onConfirmParse(latestDetection);
  });
  copyBtn.addEventListener('click', () => {
    if (latestDetection.text) {
      navigator.clipboard?.writeText(latestDetection.text).then(()=> {
        alert('クリップボードにコピーしました');
      }).catch(()=> {
        alert('コピーに失敗しました');
      });
    } else {
      alert('コピーするテキストがありません');
    }
  });
}

// 解析確定時の挙動（必要に応じて編集）
function onConfirmParse(detection){
  // detection: { text, format, raw }
  // ここで API に投げる / フォームに入れる 等、実アプリ固有の処理を行ってください
  // デモではダイアログで表示
  const msg = `解析確定しました。\n\n内容:\n${detection.text}\n\nフォーマット: ${detection.format || '不明'}`;
  alert(msg);
}

// 検出ループ（BarcodeDetector / ZXing を切り替え）
let detectionLoopController = { cancelled: false };

async function startDetectionLoop(){
  // 既に検出中なら停止してから再開
  detectionLoopController.cancelled = true;
  detectionLoopController = { cancelled: false };

  // 優先: BarcodeDetector
  if (barcodeDetector) {
    // Create an offscreen/hidden canvas to capture frames (useful for better control)
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    try {
      while (!detectionLoopController.cancelled && scanning) {
        if (video.readyState < 2) { // HAVE_CURRENT_DATA
          await new Promise(resolve => setTimeout(resolve, 100));
          continue;
        }
        // サイズ同期
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        try{
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageBitmap = await createImageBitmap(canvas);
          const barcodes = await barcodeDetector.detect(imageBitmap);
          if (barcodes && barcodes.length) {
            // 取れたものは複数ありうる。ここでは最初のものを採用し UI 表示
            const b = barcodes[0];
            updateLatestDetection(b.rawValue || b.rawValue, b.format || b.format);
            // 連続して同じものを表示し続けたくない場合はここで多少間隔を置く
            // await new Promise(resolve => setTimeout(resolve, 200));
          }
          imageBitmap.close();
        }catch(e){
          // 一部ブラウザでは detect でたまに例外が出る
          console.warn('detect loop error', e);
        }
        // 少し待つ（CPU負荷抑制）
        await new Promise(resolve => setTimeout(resolve, 150));
      }
    } catch (err) {
      console.error('BarcodeDetector loop failed, will fallback if possible', err);
      // フォールバック開始
      await ensureZXingLoaded();
      startZXingContinuous();
    }
  } else {
    // BarcodeDetector がない -> ZXing を動的ロードして連続検出
    await ensureZXingLoaded();
    startZXingContinuous();
  }
}

// ZXing 読み込み（動的）
function ensureZXingLoaded(){
  return new Promise((resolve, reject) => {
    if (zxingLoaded) return resolve();
    if (zxingScriptLoaded) {
      // 他の箇所で読み込み中
      const check = setInterval(()=> {
        if (zxingLoaded) { clearInterval(check); resolve(); }
      }, 100);
      return;
    }
    zxingScriptLoaded = true;
    const s = document.createElement('script');
    s.src = zxingModuleUrl;
    s.onload = () => {
      zxingLoaded = true;
      zxingScriptLoaded = false;
      console.log('ZXing library loaded');
      resolve();
    };
    s.onerror = (e) => {
      zxingScriptLoaded = false;
      console.error('Failed to load ZXing library', e);
      reject(new Error('ZXing ライブラリの読み込みに失敗しました'));
    };
    document.head.appendChild(s);
  });
}

// ZXing での連続読み取り開始
function startZXingContinuous(){
  try {
    // @zxing/library の UMD はグローバルに ZXing として公開される想定
    const ZXing = window.ZXing || window.ZXingBrowser || window.ZXingLibrary || window['@zxing/library'] || window['ZXing'];
    if (!ZXing && typeof window.BrowserMultiFormatReader === 'undefined' && typeof window.ZXing === 'undefined') {
      // いくつかの CDN では UMD 名前が異なるため、index.min.js を load した直後は window.ZXing にいるか確認
      // try common path:
      // Some builds define BrowserMultiFormatReader on window
    }
    // try multiple known symbols
    const BrowserMultiFormatReader = window.BrowserMultiFormatReader || (ZXing && ZXing.BrowserMultiFormatReader) || (window.ZXing && window.ZXing.BrowserMultiFormatReader);
    if (!BrowserMultiFormatReader) {
      console.error('Cannot find BrowserMultiFormatReader in loaded ZXing library', window.ZXing, ZXing, window.BrowserMultiFormatReader);
      alert('ZXing の初期化に失敗しました。BarcodeDetector 非対応のブラウザでは動作しない可能性があります。');
      return;
    }

    // Reader 初期化
    if (zxingReader && typeof zxingReader.reset === 'function') {
      try { zxingReader.reset(); } catch (e) {}
    }
    zxingReader = new BrowserMultiFormatReader();
    // decodeFromVideoDevice を使ってコールバックで継続検出
    zxingReader.listVideoInputDevices()
      .then(videoInputDevices => {
        // 既に deviceSelect にある機器リストと同じか確認して必要なら更新
        if (!devices.length && videoInputDevices && videoInputDevices.length) {
          devices = videoInputDevices.map(v=>({ deviceId: v.deviceId, label: v.label || 'カメラ' }));
          deviceSelect.innerHTML = '';
          devices.forEach((d,i)=>{
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.text = d.label || `カメラ ${i+1}`;
            deviceSelect.appendChild(opt);
          });
          if (devices.length>0) {
            currentDeviceId = devices[0].deviceId;
            deviceSelect.value = currentDeviceId;
          }
        }
        // 実際に decodeFromVideoDevice を開始
        const targetDeviceId = currentDeviceId || (devices[0] && devices[0].deviceId) || undefined;
        zxingReader.decodeFromVideoDevice(targetDeviceId, video, (result, err) => {
          if (result) {
            // result は ZXing の Result オブジェクト
            updateLatestDetection(result.getText(), result.getBarcodeFormat && result.getBarcodeFormat());
          }
          if (err && !(err instanceof ZXing.NotFoundException)) {
            // 単純に NotFound は無視（検出なし）
            // console.error(err);
          }
        });
      })
      .catch(err => {
        console.error('ZXing listVideoInputDevices error', err);
      });
  } catch (e) {
    console.error('startZXingContinuous error', e);
  }
}

// 最新検出更新（UI）
function updateLatestDetection(text, format){
  // 同一内容が高速連続で来ると鬱陶しいため、差分があるときだけ更新（ただし常に最新を上書きする方が良ければコメントアウト）
  if (!text) return;
  if (latestDetection.text === text && latestDetection.format === format) return;
  latestDetection = { text: String(text), format: String(format || 'unknown'), raw: null, time: Date.now() };
  detectedEl.textContent = latestDetection.text;
  formatInfoEl.textContent = 'フォーマット: ' + (latestDetection.format || '不明');
  // 任意: ここでサウンドや振動を出すなどのフィードバックが可能
}

// ページアンロード時にカメラ停止
window.addEventListener('pagehide', stopCamera);
window.addEventListener('beforeunload', stopCamera);

// 初期化実行
init();

// 便利: ページ読み込み直後に自動開始したい場合は startBtn.click() を呼ぶ
</script>
</body>
</html>
