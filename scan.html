<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>魔法スキャナー</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{
  --accent-red:#ff2d55;
  --ready-green:#00ffcc;
  --panel-dark:#0f1120;
  --glow-red:0 0 18px rgba(255,45,85,0.5);
  --glow-green:0 0 18px rgba(0,255,204,0.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%; width:100%; overflow:hidden;}
body{
  background:#000; color:#e6e9ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column;
}
#reader-wrapper{ position:relative; width:100%; flex: 1; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
#reader{ width:100%!important; height:100%!important; }
#reader video{ width:100%!important; height:100%!important; object-fit:cover!important; }

#success-flash, #error-flash{ position:absolute; inset:0; pointer-events:none; z-index:160; opacity:0; transition:opacity .18s ease; }
#success-flash{ background: rgba(0,255,204,0.15); }
#success-flash.show{ opacity:1; }
#error-flash{ background: rgba(255,45,85,0.12); }
#error-flash.show{ opacity:1; }

#overlay-msg{ position:absolute; top:15%; left:50%; transform:translateX(-50%); background:rgba(6,10,20,0.9); padding:10px 18px; border-radius:12px; border:1px solid rgba(255,45,85,0.2); z-index:170; opacity:0; pointer-events:none; transition:opacity .2s; white-space: nowrap; }
#overlay-msg.show{ opacity:1; }

.controls{ width:100%; background:var(--panel-dark); border-top:1px solid rgba(255,255,255,0.1); padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:12px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); z-index:200; }
#status-msg{ font-size:.9rem; color:#9aa3b2; text-align:center; min-height:1.2em; font-weight: 500;}
#status-msg.ready{ color:var(--ready-green); text-shadow:var(--glow-green); }

#scan-trigger{ width:100%; max-width:400px; height:60px; border-radius:16px; border:none; background: linear-gradient(135deg, var(--accent-red), #ff6a88); color:#fff; font-weight:800; font-size:1.1rem; box-shadow:var(--glow-red); cursor: pointer; }

.action-group{ width:100%; max-width:400px; display:flex; gap:12px; justify-content: space-between; }
.sub-btn{ flex: 1; height:48px; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.05); color:#fff; font-weight:600; font-size:.95rem; display:flex; align-items:center; justify-content:center; text-decoration:none; cursor: pointer; }
.debug-btn{ border-color: rgba(255,204,0,0.3); color: #ffcc00; }

#result-modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; justify-content:center; align-items:center; padding:20px; }
.modal-card{ width:100%; max-width:450px; background:#16182a; border-radius:24px; padding:24px; text-align:center; border:1px solid rgba(255,45,85,0.3); }
.modal-name{ font-size:1.6rem; color:var(--accent-red); font-weight:900; margin:10px 0; }
.modal-cta{ width:100%; height:50px; border-radius:12px; border:none; background:var(--accent-red); color:#fff; font-weight:700; margin-top:15px; cursor: pointer;}
</style>
</head>
<body>
<div id="reader-wrapper">
  <div id="success-flash"></div>
  <div id="error-flash"></div>
  <div id="reader"></div>
  <div id="overlay-msg"></div>
</div>
<div class="controls">
  <div id="status-msg">スキャン準備中...</div>
  <button id="scan-trigger" onclick="pressScan()">解析を確定する</button>
  <div class="action-group">
    <button class="sub-btn" onclick="switchCamera()">🔄 カメラ切替</button>
    <button class="sub-btn debug-btn" onclick="debugInputText()">🛠️ デバッグ</button>
    <a href="index.html" class="sub-btn">戻る</a>
  </div>
</div>
<div id="result-modal">
  <div class="modal-card">
    <div style="font-size:0.8rem; color:#9aa3b2;">DATA ACQUIRED</div>
    <div id="modal-name" class="modal-name"></div>
    <div id="modal-desc" style="color:#cfe7ff; margin-bottom:15px;"></div>
    <button class="modal-cta" onclick="confirmAndReturn()">閉じて元に戻る</button>
    <div style="margin-top:12px;"><a href="#" style="color:#9aa3b2; font-size:0.9rem;" onclick="cancelModal();return false;">キャンセル</a></div>
  </div>
</div>

<script>
let html5QrCode = null;
let currentFacingMode = "environment"; 
let lastResult = null;
let scanArmed = false;
let gameData = null;
let focusIntervalId = null;
let isSwitching = false;

window.onload = loadData;

async function loadData(){
  try{
    const res = await fetch('magics.json?t=' + Date.now(), { cache: 'no-store' });
    gameData = await res.json();
  }catch(e){ gameData = { magics: [], media_data: {} }; }
  startScanner("environment");
}

async function startScanner(facing){
  if(html5QrCode){ await html5QrCode.stop().catch(()=>{}); html5QrCode = null; }
  if(focusIntervalId){ clearInterval(focusIntervalId); focusIntervalId = null; }
  lastResult = null; scanArmed = false;
  setStatus("スキャナーを起動中...", false);
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 25, qrbox: (w, h) => ({ width: w * 0.8, height: h * 0.8 }) };
  try{
    await html5QrCode.start({ facingMode: facing }, config, (text) => {
      lastResult = text;
      if(!scanArmed){ scanArmed = true; setStatus("解析確定可能", true); }
    });
    currentFacingMode = facing;
    setStatus("コードを探索中...", false);
    enableAutoFocus();
  }catch(err){ setStatus("カメラの起動に失敗しました", false); }
}

async function switchCamera(){
  if(isSwitching) return;
  isSwitching = true;
  const nextMode = (currentFacingMode === "environment") ? "user" : "environment";
  await startScanner(nextMode);
  isSwitching = false;
}

function enableAutoFocus(){
  const apply = async () => {
    try {
      const track = html5QrCode?.getRunningTrack();
      if (!track) return;
      const caps = track.getCapabilities();
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{focusMode: 'continuous'}] });
      } else {
        if (focusIntervalId) {
          clearInterval(focusIntervalId);
          focusIntervalId = null;
        }
      }
    } catch (e) {
      if (focusIntervalId) clearInterval(focusIntervalId);
    }
  };
  apply();
  focusIntervalId = setInterval(apply, 3000);
}

function pressScan(){
  if(!scanArmed || !lastResult){ showOverlay("対象を捉えてください"); playErrorEffect(); return; }
  handleSuccess(lastResult);
}

// デバッグ用：手入力テキストでスキャン処理を実行する関数
function debugInputText(){
  const input = prompt("【デバッグ】読み取るコード文字列を入力してください:");
  if (input !== null && input.trim() !== "") {
    handleSuccess(input);
  }
}

async function handleSuccess(rawText){
  const text = (rawText||"").replace(/\*/g,"").trim();
  const flowConnectUrl = "https://syukurimu1729.github.io/FlowConnect/";
  
  if(text === flowConnectUrl || text === flowConnectUrl + "index.html"){
    playSuccessEffect();
    localStorage.setItem('currentMedia', "FORMGAME");
    showOverlay("魔法陣に接続中...");
    setTimeout(() => { confirmAndReturn(); }, 800);
    return;
  }

  if(text.startsWith("MEDIA:")){
    const mediaId = text.split(":")[1];
    if(gameData?.media_data?.[mediaId]){
      playSuccessEffect();
      localStorage.setItem('currentMedia', mediaId);
      confirmAndReturn();
      return;
    }
  }

  const magic = gameData?.magics?.find(m => m.code === text);
  if(magic){
    let my = JSON.parse(localStorage.getItem('myMagics') || "[]");
    if(!my.includes(magic.id)){
      playSuccessEffect();
      my.push(magic.id);
      localStorage.setItem('myMagics', JSON.stringify(my));
      showModal(magic.name, magic.desc);
    } else {
      playErrorEffect();
      showOverlay("既に習得済みの魔法です");
      resetScannerState();
    }
  } else {
    playErrorEffect();
    showOverlay("未登録のコードです");
    resetScannerState();
  }
}

function resetScannerState(){
  scanArmed = false; 
  lastResult = null; 
  setStatus("コードを探索中...", false);
}

function setStatus(text, ready){
  const st = document.getElementById('status-msg');
  if(st) {
    st.innerText = text; 
    st.classList.toggle('ready', !!ready);
  }
}

function showOverlay(msg){
  const el = document.getElementById('overlay-msg');
  el.innerText = msg; el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 2000);
}

function playSuccessEffect(){
  document.getElementById('success-flash').classList.add('show');
  if(navigator.vibrate) navigator.vibrate(60);
  setTimeout(()=> document.getElementById('success-flash').classList.remove('show'), 300);
}

function playErrorEffect(){
  document.getElementById('error-flash').classList.add('show');
  if(navigator.vibrate) navigator.vibrate([40,40]);
  setTimeout(()=> document.getElementById('error-flash').classList.remove('show'), 300);
}

function showModal(name, desc){
  document.getElementById('modal-name').innerText = name;
  document.getElementById('modal-desc').innerText = desc;
  document.getElementById('result-modal').style.display = 'flex';
}

function cancelModal(){
  document.getElementById('result-modal').style.display = 'none';
  resetScannerState();
}

async function confirmAndReturn(){
  if(html5QrCode) await html5QrCode.stop().catch(()=>{});
  location.href = "index.html";
}

window.addEventListener('pagehide', () => {
  if(focusIntervalId) clearInterval(focusIntervalId);
});
</script>
</body>
</html>
