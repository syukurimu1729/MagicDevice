<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>魔法スキャナー</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --accent-red:#ff2d55;
  --ready-green:#00ffcc;
  --bg-dark:#0d0d1a;
  --panel-dark:#0f1120;
  --glow-red:0 0 18px rgba(255,45,85,0.5);
  --glow-green:0 0 18px rgba(0,255,204,0.45);
  --controls-h:180px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  background:#000;
  color:#e6e9ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* camera area */
#reader-wrapper{
  position:relative;
  width:100%;
  height: calc(100dvh - var(--controls-h));
  max-height: calc(100dvh - var(--controls-h));
  overflow:hidden;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

#reader{
  width:100%!important;
  height:100%!important;
  max-width:900px;
}

#reader video{
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  display:block;
}

/* flash */
#flash-layer{ position:absolute; inset:0; pointer-events:none; z-index:150; }

#success-flash{
  position:absolute;
  inset:0;
  background: rgba(0,255,204,0.10);
  mix-blend-mode: screen;
  opacity:0;
  pointer-events:none;
  z-index:160;
  transition: opacity 160ms ease-out;
}

#success-flash.show{
  opacity:1;
}

#error-flash{
  position:absolute;
  inset:0;
  background: rgba(255,45,85,0.10);
  mix-blend-mode: screen;
  opacity:0;
  pointer-events:none;
  z-index:160;
}

#error-flash.show{
  opacity:1;
}

/* HUD corners */
.hud-corner{
  position:absolute;
  width:30px;
  height:30px;
  border:2px solid var(--accent-red);
  filter:drop-shadow(var(--glow-red));
  z-index:140;
}

.top-left{ top:16px; left:16px; border-right:none; border-bottom:none; }
.top-right{ top:16px; right:16px; border-left:none; border-bottom:none; }
.bottom-left{ bottom:16px; left:16px; border-right:none; border-top:none; }
.bottom-right{ bottom:16px; right:16px; border-left:none; border-top:none; }

/* overlay message */
#overlay-msg{
  position:absolute;
  top:10%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(6,10,20,0.9);
  padding:10px 14px;
  border-radius:12px;
  border:1px solid rgba(255,45,85,0.2);
  z-index:170;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

#overlay-msg.show{
  opacity:1;
}

/* controls */
.controls{
  width:100%;
  background:var(--panel-dark);
  border-top:1px solid rgba(255,45,85,0.06);
  padding:18px 16px calc(22px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

#status-msg{
  font-size:.9rem;
  color:#9aa3b2;
}

#status-msg.ready{
  color:var(--ready-green);
  text-shadow:var(--glow-green);
}

#scan-trigger{
  width:100%;
  max-width:520px;
  height:56px;
  border-radius:14px;
  border:none;
  background: linear-gradient(135deg,var(--accent-red),#ff6a88);
  color:#fff;
  font-weight:800;
  font-size:1.05rem;
  box-shadow:var(--glow-red);
  cursor:pointer;
}

.btn-group{
  display:flex;
  gap:10px;
}

.mode-btn{
  min-width:48px;
  height:44px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.05);
  background:#0c0c12;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.back-link{
  color:#9aa3b2;
  text-decoration:none;
  font-size:.86rem;
}

/* modal */
#result-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  z-index:999;
  justify-content:center;
  align-items:center;
  padding:22px;
}

.modal-card{
  width:100%;
  max-width:520px;
  background:#0f1030;
  border-radius:20px;
  padding:22px;
  text-align:center;
}

.modal-name{
  font-size:2rem;
  color:var(--accent-red);
  font-weight:900;
  margin:10px 0;
}

.modal-desc{
  margin-bottom:18px;
}

.modal-cta{
  width:100%;
  height:56px;
  border:none;
  border-radius:12px;
  background:#00ffd0;
  font-weight:800;
  cursor:pointer;
}

.modal-cancel{
  margin-top:12px;
  display:inline-block;
  color:#ffdfe8;
  text-decoration:underline;
  cursor:pointer;
}

#reader__dashboard{ display:none!important; }

</style>
</head>

<body>

<div id="reader-wrapper">

<div id="flash-layer"></div>
<div id="success-flash"></div>
<div id="error-flash"></div>

<div class="hud-corner top-left"></div>
<div class="hud-corner top-right"></div>
<div class="hud-corner bottom-left"></div>
<div class="hud-corner bottom-right"></div>

<div id="reader"></div>

<div id="overlay-msg"></div>

</div>

<div class="controls">

<div id="status-msg">コードを探索中...</div>

<button id="scan-trigger" onclick="pressScan()">解析を確定する</button>

<div class="btn-group">
<button class="mode-btn" onclick="switchCamera()">📷</button>
</div>

<a href="index.html" class="back-link">CANCEL</a>

</div>

<div id="result-modal">

<div class="modal-card">

<div>DATA ACQUIRED</div>

<div id="modal-name" class="modal-name"></div>

<div id="modal-desc" class="modal-desc"></div>

<button class="modal-cta" onclick="confirmAndReturn()">閉じるして元に戻る</button>

<div>
<a href="#" class="modal-cancel" onclick="cancelModal();return false;">キャンセル</a>
</div>

</div>

</div>

<script>

let html5QrCode;
let cameras=[];
let cameraIndex=0;

let lastResult=null;
let scanArmed=false;

let gameData=null;

async function loadData(){

const res=await fetch("magics.json");
gameData=await res.json();

cameras=await Html5Qrcode.getCameras();

const back=cameras.findIndex(c=>/back|rear|environment/i.test(c.label));

cameraIndex=back>=0?back:0;

startScanner();

}

async function startScanner(){

lastResult=null;
scanArmed=false;

document.getElementById("status-msg").innerText="コードを探索中...";

if(html5QrCode) await html5QrCode.stop().catch(()=>{});

html5QrCode=new Html5Qrcode("reader");

const formats=[
Html5QrcodeSupportedFormats.QR_CODE,
Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.CODE_128,
Html5QrcodeSupportedFormats.CODE_39,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E
];

await html5QrCode.start(

(cameras && cameras[cameraIndex])?cameras[cameraIndex].id:{facingMode:"environment"},

{fps:10,formatsToSupport:formats},

(text)=>{

if(!scanArmed){

lastResult=text;
scanArmed=true;

const s=document.getElementById("status-msg");

s.classList.add("ready");

s.innerText="解析確定可能";

}else{

lastResult=text;

}

}

);

}

function switchCamera(){

cameraIndex=(cameraIndex+1)%cameras.length;

startScanner();

}

function pressScan(){

if(!scanArmed){

showOverlay("対象を合わせてください");

return;

}

handleSuccess(lastResult);

}

function showOverlay(msg){

const el=document.getElementById("overlay-msg");

el.innerText=msg;

el.classList.add("show");

setTimeout(()=>el.classList.remove("show"),2000);

}

function playSuccess(){

const f=document.getElementById("success-flash");

f.classList.add("show");

setTimeout(()=>f.classList.remove("show"),300);

}

function playError(){

const f=document.getElementById("error-flash");

f.classList.add("show");

setTimeout(()=>f.classList.remove("show"),400);

}

async function handleSuccess(text){

const clean=text.replace(/\*/g,"");

if(clean.startsWith("MEDIA:")){

const id=clean.split(":")[1];

playSuccess();

setTimeout(()=>{

localStorage.setItem("currentMedia",id);

location.href="index.html";

},400);

return;

}

const magic=gameData.magics.find(m=>m.code===clean);

if(magic){

playSuccess();

let myMagics=JSON.parse(localStorage.getItem("myMagics")||"[]");

if(!myMagics.includes(magic.id)){

myMagics.push(magic.id);

localStorage.setItem("myMagics",JSON.stringify(myMagics));

}

setTimeout(()=>{

showModal(magic.name,magic.desc);

},400);

}else{

playError();

showOverlay("魔法コードが見つかりませんでした");

scanArmed=false;

lastResult=null;

setTimeout(startScanner,700);

}

}

function showModal(name,desc){

document.getElementById("modal-name").innerText=name;

document.getElementById("modal-desc").innerText=desc;

document.getElementById("result-modal").style.display="flex";

}

function cancelModal(){

document.getElementById("result-modal").style.display="none";

scanArmed=false;

lastResult=null;

startScanner();

}

function confirmAndReturn(){

location.href="index.html";

}

window.onload=loadData;

</script>

</body>
</html>
