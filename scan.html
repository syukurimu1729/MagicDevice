<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>魔法スキャナー</title>

<!-- ローカルに置いた html5-qrcode -->
<script src="html5-qrcode.min.js"></script>

<style>
:root{
  --accent-red:#ff2d55;
  --ready-green:#00ffcc;
  --panel-dark:#0f1120;
  --glow-red:0 0 18px rgba(255,45,85,0.5);
  --glow-green:0 0 18px rgba(0,255,204,0.45);
  --controls-h:120px; /* 調整: Cancelが隠れないように詰めた */
}

/* 基本リセット */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000;color:#e6e9ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* カメラ領域 */
#reader-wrapper{
  position:relative;
  width:100%;
  height: calc(100dvh - var(--controls-h));
  max-height: calc(100dvh - var(--controls-h));
  background:#000;
  display:flex;align-items:center;justify-content:center;
}
#reader{ width:100%!important; height:100%!important; max-width:900px; }
#reader video{ width:100%!important; height:100%!important; object-fit:cover!important; display:block; }

/* フラッシュ */
#success-flash, #error-flash{
  position:absolute; inset:0; pointer-events:none; z-index:160; opacity:0; transition:opacity .18s ease;
}
#success-flash{ background: rgba(0,255,204,0.12); }
#success-flash.show{ opacity:1; }
#error-flash{ background: rgba(255,45,85,0.10); }
#error-flash.show{ opacity:1; }

/* HUDコーナー */
.hud-corner{ position:absolute; width:30px; height:30px; border:2px solid var(--accent-red); z-index:140; border-radius:6px; opacity:0.9; }
.top-left{ top:12px; left:12px; border-right:none; border-bottom:none; }
.top-right{ top:12px; right:12px; border-left:none; border-bottom:none; }
.bottom-left{ bottom:12px; left:12px; border-right:none; border-top:none; }
.bottom-right{ bottom:12px; right:12px; border-left:none; border-top:none; }

/* オーバーレイメッセージ */
#overlay-msg{
  position:absolute; top:10%; left:50%; transform:translateX(-50%);
  background:rgba(6,10,20,0.9); padding:10px 14px; border-radius:12px;
  border:1px solid rgba(255,45,85,0.12); z-index:170; opacity:0; pointer-events:none; transition:opacity .18s;
}
#overlay-msg.show{ opacity:1; }

/* コントロール */
.controls{
  width:100%;
  background:var(--panel-dark);
  border-top:1px solid rgba(255,45,85,0.06);
  padding:10px 14px calc(8px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center; gap:8px;
  box-shadow: 0 -8px 20px rgba(0,0,0,0.45);
  position:relative;
}
#top-actions{ width:100%; display:flex; justify-content:space-between; align-items:center; padding:0 6px; }
.back-link{
  color:#cdd6e6; text-decoration:none; font-size:.95rem; padding:6px 10px; border-radius:8px;
  background: rgba(255,255,255,0.02);
}
#status-msg{ font-size:.9rem; color:#9aa3b2; text-align:center; min-height:1.1em; }
#status-msg.ready{ color:var(--ready-green); text-shadow:var(--glow-green); }

/* ボタン */
#scan-trigger{
  width:100%; max-width:520px; height:56px; border-radius:14px; border:none;
  background: linear-gradient(135deg,var(--accent-red),#ff6a88);
  color:#fff; font-weight:800; font-size:1.05rem; box-shadow:var(--glow-red);
  -webkit-tap-highlight-color:transparent;
}
.mode-btn{ min-width:48px; height:44px; border-radius:999px; border:1px solid rgba(255,255,255,0.04); background:#0c0c12; color:#fff; font-weight:700; cursor:pointer; }

/* モーダル */
#result-modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; justify-content:center; align-items:center; padding:18px; }
.modal-card{ width:100%; max-width:520px; background: linear-gradient(180deg,#0f1030,#0b0b18); border-radius:16px; padding:16px; text-align:center; color:#e9ecff; }
.modal-name{ font-size:1.4rem; color:var(--accent-red); font-weight:900; margin:8px 0; }
.modal-desc{ margin-bottom:10px; color:#cfe7ff; }

/* 高さの小さい画面用調整 */
@media (max-height:700px){
  :root{ --controls-h:110px; }
  #reader-wrapper{ height: calc(100dvh - var(--controls-h)); }
  .controls{ padding:8px 12px calc(6px + env(safe-area-inset-bottom)); gap:6px; }
}
</style>
</head>

<body>

<!-- camera area -->
<div id="reader-wrapper">
  <div id="success-flash" aria-hidden="true"></div>
  <div id="error-flash" aria-hidden="true"></div>

  <div class="hud-corner top-left"></div>
  <div class="hud-corner top-right"></div>
  <div class="hud-corner bottom-left"></div>
  <div class="hud-corner bottom-right"></div>

  <div id="reader"></div>

  <div id="overlay-msg" role="status" aria-live="polite"></div>
</div>

<!-- controls -->
<div class="controls" role="region" aria-label="controls">
  <div id="top-actions">
    <a href="index.html" class="back-link">元の画面に戻る</a>
    <div class="btn-group">
      <button class="mode-btn" id="camera-switch" onclick="switchCamera()" aria-label="カメラ切替">🔄</button>
    </div>
  </div>

  <div id="status-msg">コードを探索中...</div>

  <button id="scan-trigger" onclick="pressScan()">解析を確定する</button>
</div>

<!-- modal -->
<div id="result-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-title" class="modal-title">DATA ACQUIRED</div>
    <div id="modal-name" class="modal-name"></div>
    <div id="modal-desc" class="modal-desc"></div>
    <button class="modal-cta" id="modal-ok" onclick="confirmAndReturn()" style="margin-top:6px;">閉じるして元に戻る</button>
    <div style="margin-top:8px;"><a href="#" class="modal-cancel" onclick="cancelModal();return false;">キャンセル</a></div>
  </div>
</div>

<script>
/* ======================================================
   インデックス:
   1. グローバル変数
   2. 初期化(loadData)
   3. startScanner / stopScanner
   4. Autofocus & quality
   5. Scan callbacks & confirm
   6. Success handling
   7. UI helpers & modal
   8. Camera switch / cleanup
   ====================================================== */

/* 1. グローバル変数 */
let html5QrCode = null;
let cameras = [];
let cameraIndex = 0;
let lastResult = null;
let scanArmed = false;
let gameData = null;
let focusIntervalId = null;

/* 2. 初期化 */
window.onload = loadData;
async function loadData(){
  try{
    const res = await fetch('magics.json');
    gameData = await res.json();
  }catch(e){
    console.warn('magics.json load failed', e);
    gameData = { magics: [], media_data: {} };
  }

  try{
    cameras = await Html5Qrcode.getCameras();
  }catch(e){
    console.warn('getCameras failed', e);
    cameras = [];
  }

  const foundBack = cameras.findIndex(c => /back|rear|environment/i.test(c.label));
  cameraIndex = foundBack >= 0 ? foundBack : 0;

  await startScanner();
}

/* 3. startScanner / stopScanner */
async function startScanner(){
  // stop existing
  if(html5QrCode){
    try{ await html5QrCode.stop(); }catch(e){}
    html5QrCode = null;
  }
  if(focusIntervalId){ clearInterval(focusIntervalId); focusIntervalId = null; }

  lastResult = null; scanArmed = false;
  setStatus("コードを探索中...", false);

  html5QrCode = new Html5Qrcode("reader");

  const formats = [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E
  ];

  // try to use camera id; fallback to facingMode object
  const cameraIdOrFacingMode = (cameras && cameras[cameraIndex]) ? cameras[cameraIndex].id : { facingMode: "environment" };

  const config = {
    fps: 20,
    aspectRatio: 16/9,
    // Use full frame for best image quality (do not limit qrbox)
    qrbox: false,
    formatsToSupport: formats,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    // prefer high resolution if available
    videoConstraints: {
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      facingMode: "environment"
    }
  };

  try{
    await html5QrCode.start(
      cameraIdOrFacingMode,
      config,
      (decodedText, decodedResult) => {
        lastResult = decodedText;
        if(!scanArmed){
          scanArmed = true;
          setStatus("解析確定可能", true);
        }
      },
      (errorMessage) => {
        // per-frame errors can be ignored
      }
    );

    // After stream is started, attempt to improve focus/quality
    enableAutoFocusAndQuality();

  }catch(err){
    console.error("Scanner start failed", err);
    setStatus("カメラを起動できません", false);
  }
}

async function stopScanner(){
  if(html5QrCode){
    try{ await html5QrCode.stop(); }catch(e){}
    html5QrCode = null;
  }
  if(focusIntervalId){ clearInterval(focusIntervalId); focusIntervalId = null; }
}

/* 4. Autofocus & quality (端末依存) */
async function enableAutoFocusAndQuality(){
  if(!html5QrCode) return;
  try{
    const track = html5QrCode.getRunningTrack();
    if(!track) return;

    // Request higher resolution and continuous focus/exposure if supported
    try{
      await track.applyConstraints({
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [
          { focusMode: "continuous" },
          { exposureMode: "continuous" }
        ]
      });
    }catch(e){
      // ignore unsupported
    }

    // periodic re-apply for devices prone to lose AF
    focusIntervalId = setInterval(async () => {
      try{
        const t = html5QrCode.getRunningTrack();
        if(!t) return;
        await t.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
      }catch(e){}
    }, 2500);

  }catch(e){
    console.warn("autofocus/quality not supported:", e);
  }
}

/* 5. Scan callbacks & confirm */
function pressScan(){
  if(!scanArmed || !lastResult){
    setStatus("対象を合わせてください", false);
    playErrorEffect();
    showOverlay("読み取りが確認できません。画面内に対象を合わせてください。", 'error', 2200);
    return;
  }
  handleSuccess(lastResult);
}

/* 6. Success handling */
async function handleSuccess(rawText){
  const text = (rawText||"").replace(/\*/g,"");

  // MEDIA: QR handling
  if(text.startsWith("MEDIA:")){
    const id = text.split(":")[1] || "";
    playSuccessEffect();
    setTimeout(async () => {
      try{ localStorage.setItem('currentMedia', id); }catch(e){}
      try{ if(html5QrCode) await html5QrCode.stop(); }catch(e){}
      location.href = "index.html";
    }, 420);
    return;
  }

  // barcode -> magics lookup
  const magic = (gameData && gameData.magics) ? gameData.magics.find(m => m.code === text) : null;
  if(magic){
    try{
      let myMagics = JSON.parse(localStorage.getItem('myMagics') || "[]");
      if(!myMagics.includes(magic.id)){ myMagics.push(magic.id); localStorage.setItem('myMagics', JSON.stringify(myMagics)); }
    }catch(e){}
    playSuccessEffect();
    setTimeout(()=> showModal("DATA ACQUIRED", magic.name, magic.desc), 360);
    return;
  }

  // not found
  playErrorEffect();
  showOverlay("魔法コードが見つかりませんでした", 'error', 2600);
  setTimeout(()=>{ scanArmed=false; lastResult=null; setStatus("コードを探索中...", false); startScanner(); }, 900);
}

/* 7. UI helpers & modal */
function setStatus(text, ready){
  const st = document.getElementById('status-msg');
  st.innerText = text;
  st.classList.toggle('ready', !!ready);
}
function showOverlay(msg, type='info', duration=1800){
  const el = document.getElementById('overlay-msg');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), duration);
}
function playSuccessEffect(){
  const el = document.getElementById('success-flash');
  el.classList.add('show');
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  setTimeout(()=> el.classList.remove('show'), 320);
}
function playErrorEffect(){
  const el = document.getElementById('error-flash');
  el.classList.add('show');
  if(navigator.vibrate) try{ navigator.vibrate([30,20,30]); }catch(e){}
  setTimeout(()=> el.classList.remove('show'), 420);
}

/* modal */
function showModal(title, name, desc){
  document.getElementById('modal-title').innerText = title || "DATA ACQUIRED";
  document.getElementById('modal-name').innerText = name || "";
  document.getElementById('modal-desc').innerText = desc || "";
  document.getElementById('result-modal').style.display = 'flex';
  document.body.classList.add('modal-open');
}
function cancelModal(){
  document.getElementById('result-modal').style.display = 'none';
  document.body.classList.remove('modal-open');
  scanArmed=false; lastResult=null;
  startScanner();
}
function confirmAndReturn(){
  if(html5QrCode){ html5QrCode.stop().catch(()=>{}); }
  setTimeout(()=> location.href = "index.html", 180);
}

/* 8. camera switch / cleanup */
function switchCamera(){
  if(!cameras || cameras.length <= 1){ showOverlay("カメラが複数見つかりません", 'error', 1500); return; }
  cameraIndex = (cameraIndex + 1) % cameras.length;
  startScanner();
}

/* cleanup on page unload — do NOT use onbeforeunload to avoid "ページを離れますか" dialog */
window.onpagehide = async () => {
  // release camera if possible (no beforeunload prompt)
  if(html5QrCode){
    try{ await html5QrCode.stop(); }catch(e){}
  }
  if(focusIntervalId){ clearInterval(focusIntervalId); focusIntervalId = null; }
};
</script>
</body>
</html>
