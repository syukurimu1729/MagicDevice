<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>魔法スキャナー</title>

<script src="html5-qrcode.min.js"></script>

<style>
:root{
  --accent-red:#ff2d55;
  --ready-green:#00ffcc;
  --panel-dark:#0f1120;
  --glow-red:0 0 18px rgba(255,45,85,0.5);
  --glow-green:0 0 18px rgba(0,255,204,0.45);
  /* 下部UIの高さを少し広めに確保 */
  --controls-h: 210px;
}

/* リセット */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%; width:100%; overflow:hidden;}
body{
  background:#000; color:#e6e9ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* カメラ表示領域：画面上部を広く使う */
#reader-wrapper{
  position:relative;
  width:100%;
  flex: 1; /* 残りのスペースをすべて使う */
  background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
/* html5-qrcode内部のビデオ表示 */
#reader{ width:100%!important; height:100%!important; }
#reader video{ width:100%!important; height:100%!important; object-fit:cover!important; }

/* 成功・エラー時のフラッシュ（一瞬光る演出のみ残す） */
#success-flash, #error-flash{
  position:absolute; inset:0; pointer-events:none; z-index:160; opacity:0;
  transition:opacity .18s ease;
}
#success-flash{ background: rgba(0,255,204,0.15); }
#success-flash.show{ opacity:1; }
#error-flash{ background: rgba(255,45,85,0.12); }
#error-flash.show{ opacity:1; }

/* メッセージ表示 */
#overlay-msg{
  position:absolute; top:15%; left:50%; transform:translateX(-50%);
  background:rgba(6,10,20,0.9); padding:10px 18px; border-radius:12px;
  border:1px solid rgba(255,45,85,0.2); z-index:170; opacity:0; pointer-events:none; transition:opacity .2s;
  white-space: nowrap;
}
#overlay-msg.show{ opacity:1; }

/* コントロール領域：下部に固定 */
.controls{
  width:100%;
  background:var(--panel-dark);
  border-top:1px solid rgba(255,255,255,0.1);
  padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center; gap:16px;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
  z-index:200;
}

/* ステータスメッセージ */
#status-msg{ font-size:.9rem; color:#9aa3b2; text-align:center; min-height:1.2em; font-weight: 500;}
#status-msg.ready{ color:var(--ready-green); text-shadow:var(--glow-green); }

/* メインボタン（解析を確定する）を最上部に */
#scan-trigger{
  width:100%; max-width:400px; height:60px; border-radius:16px; border:none;
  background: linear-gradient(135deg, var(--accent-red), #ff6a88);
  color:#fff; font-weight:800; font-size:1.1rem; box-shadow:var(--glow-red);
  -webkit-tap-highlight-color:transparent;
  transition: transform 0.1s active;
}
#scan-trigger:active { transform: scale(0.97); }

/* サブボタン群（カメラ切替と戻る） */
.action-group{
  width:100%; max-width:400px;
  display:flex; gap:12px; justify-content: space-between;
}
.sub-btn{
  flex: 1; height:48px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05); color:#fff; font-weight:600; font-size:.95rem;
  display:flex; align-items:center; justify-content:center; text-decoration:none;
}

/* モーダル */
#result-modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; justify-content:center; align-items:center; padding:20px; }
.modal-card{ width:100%; max-width:450px; background:#16182a; border-radius:24px; padding:24px; text-align:center; border:1px solid rgba(255,45,85,0.3); }
.modal-name{ font-size:1.6rem; color:var(--accent-red); font-weight:900; margin:10px 0; }
.modal-cta{ width:100%; height:50px; border-radius:12px; border:none; background:var(--accent-red); color:#fff; font-weight:700; margin-top:15px;}

/* 小さな画面への対応 */
@media (max-height: 650px) {
  #scan-trigger { height: 50px; }
  .controls { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
}
</style>
</head>
<body>

<div id="reader-wrapper">
  <div id="success-flash" aria-hidden="true"></div>
  <div id="error-flash" aria-hidden="true"></div>
  
  <div id="reader"></div>
  <div id="overlay-msg" role="status"></div>
</div>

<div class="controls">
  <div id="status-msg">スキャン準備中...</div>

  <button id="scan-trigger" onclick="pressScan()">解析を確定する</button>

  <div class="action-group">
    <button class="sub-btn" onclick="switchCamera()">🔄 カメラ切替</button>
    <a href="index.html" class="sub-btn">元の画面に戻る</a>
  </div>
</div>

<div id="result-modal">
  <div class="modal-card">
    <div id="modal-title" style="font-size:0.8rem; color:#9aa3b2;">DATA ACQUIRED</div>
    <div id="modal-name" class="modal-name"></div>
    <div id="modal-desc" style="color:#cfe7ff; margin-bottom:15px;"></div>
    <button class="modal-cta" onclick="confirmAndReturn()">閉じて元に戻る</button>
    <div style="margin-top:12px;"><a href="#" style="color:#9aa3b2; font-size:0.9rem;" onclick="cancelModal();return false;">キャンセル</a></div>
  </div>
</div>

<script>
let html5QrCode = null;
let cameras = [];
let cameraIndex = 0;
let lastResult = null;
let scanArmed = false;
let gameData = null;
let focusIntervalId = null;

window.onload = loadData;

async function loadData(){
  try{
    const res = await fetch('magics.json');
    gameData = await res.json();
  }catch(e){ gameData = { magics: [], media_data: {} }; }

  try{
    cameras = await Html5Qrcode.getCameras();
    const foundBack = cameras.findIndex(c => /back|rear|environment/i.test(c.label));
    cameraIndex = foundBack >= 0 ? foundBack : 0;
    await startScanner();
  }catch(e){
    setStatus("カメラが見つかりません", false);
  }
}

async function startScanner(){
  if(html5QrCode){
    try{ await html5QrCode.stop(); }catch(e){}
    html5QrCode = null;
  }
  if(focusIntervalId){ clearInterval(focusIntervalId); focusIntervalId = null; }

  lastResult = null; scanArmed = false;
  setStatus("コードを探索中...", false);

  html5QrCode = new Html5Qrcode("reader");

  const config = {
    fps: 25,
    // qrboxを削除することで、枠を表示せず全画面スキャンにする
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    videoConstraints: {
      facingMode: "environment",
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  };

  try{
    const source = (cameras && cameras[cameraIndex]) ? { deviceId: { exact: cameras[cameraIndex].id } } : { facingMode: "environment" };
    
    await html5QrCode.start(source, config, (decodedText) => {
      lastResult = decodedText;
      if(!scanArmed){
        scanArmed = true;
        setStatus("解析確定可能", true);
      }
    });

    enableAutoFocus();
  }catch(err){
    setStatus("カメラ起動エラー", false);
  }
}

function enableAutoFocus(){
  const apply = async () => {
    try {
      const track = html5QrCode.getRunningTrack();
      if (!track) return;
      const caps = track.getCapabilities();
      const constraints = {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) constraints.focusMode = 'continuous';
      if (Object.keys(constraints).length > 0) await track.applyConstraints({ advanced: [constraints] });
    } catch (e) {}
  };
  apply();
  focusIntervalId = setInterval(apply, 3000);
}

function pressScan(){
  if(!scanArmed || !lastResult){
    showOverlay("対象を中央に合わせてください");
    playErrorEffect();
    return;
  }
  handleSuccess(lastResult);
}

async function handleSuccess(rawText){
  const text = (rawText||"").replace(/\*/g,"");
  if(text.startsWith("MEDIA:")){
    playSuccessEffect();
    setTimeout(async () => {
      localStorage.setItem('currentMedia', text.split(":")[1] || "");
      if(html5QrCode) await html5QrCode.stop();
      location.href = "index.html";
    }, 400);
    return;
  }

  const magic = (gameData?.magics) ? gameData.magics.find(m => m.code === text) : null;
  if(magic){
    playSuccessEffect();
    let my = JSON.parse(localStorage.getItem('myMagics') || "[]");
    if(!my.includes(magic.id)){ my.push(magic.id); localStorage.setItem('myMagics', JSON.stringify(my)); }
    setTimeout(()=> showModal(magic.name, magic.desc), 300);
  } else {
    playErrorEffect();
    showOverlay("未登録のコードです");
    setTimeout(()=> { scanArmed=false; lastResult=null; setStatus("コードを探索中...", false); }, 1000);
  }
}

function setStatus(text, ready){
  const st = document.getElementById('status-msg');
  st.innerText = text;
  st.classList.toggle('ready', !!ready);
}

function showOverlay(msg){
  const el = document.getElementById('overlay-msg');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 2000);
}

function playSuccessEffect(){
  document.getElementById('success-flash').classList.add('show');
  if(navigator.vibrate) navigator.vibrate(60);
  setTimeout(()=> document.getElementById('success-flash').classList.remove('show'), 300);
}
function playErrorEffect(){
  document.getElementById('error-flash').classList.add('show');
  if(navigator.vibrate) navigator.vibrate([40,40]);
  setTimeout(()=> document.getElementById('error-flash').classList.remove('show'), 300);
}

function showModal(name, desc){
  document.getElementById('modal-name').innerText = name;
  document.getElementById('modal-desc').innerText = desc;
  document.getElementById('result-modal').style.display = 'flex';
}
function cancelModal(){
  document.getElementById('result-modal').style.display = 'none';
  scanArmed=false; lastResult=null; setStatus("コードを探索中...", false);
}
function confirmAndReturn(){
  if(html5QrCode) html5QrCode.stop().catch(()=>{});
  location.href = "index.html";
}

function switchCamera(){
  if(cameras.length <= 1) return;
  cameraIndex = (cameraIndex + 1) % cameras.length;
  startScanner();
}
</script>
</body>
</html>
