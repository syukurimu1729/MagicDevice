<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no,
viewport-fit=cover">

<title>魔法スキャナー</title>

<!-- ローカルライブラリ -->
<script src="html5-qrcode.min.js"></script>

<style>

/* ================================
基本カラー
================================ */

:root{
--accent-red:#ff2d55;
--ready-green:#00ffcc;
--panel-dark:#0f1120;
--glow-red:0 0 18px rgba(255,45,85,0.5);
--glow-green:0 0 18px rgba(0,255,204,0.45);
--controls-h:180px;
}

/* ================================
リセット
================================ */

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body{

background:#000;
color:#e6e9ff;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial,
sans-serif;

display:flex;
flex-direction:column;
overflow:hidden;

}

/* ================================
カメラ
================================ */

#reader-wrapper{

position:relative;

width:100%;

height:calc(100dvh - var(--controls-h));

background:#000;

display:flex;
align-items:center;
justify-content:center;

}

#reader{

width:100%!important;
height:100%!important;
max-width:900px;

}

#reader video{

width:100%!important;
height:100%!important;

object-fit:cover!important;

}

/* ================================
フラッシュ
================================ */

#success-flash{

position:absolute;
inset:0;

background:rgba(0,255,204,0.15);

opacity:0;

transition:opacity .2s;

}

#success-flash.show{opacity:1;}

#error-flash{

position:absolute;
inset:0;

background:rgba(255,45,85,0.15);

opacity:0;

transition:opacity .2s;

}

#error-flash.show{opacity:1;}

/* ================================
コーナーUI
================================ */

.hud-corner{

position:absolute;

width:30px;
height:30px;

border:2px solid var(--accent-red);

}

.top-left{

top:16px;
left:16px;

border-right:none;
border-bottom:none;

}

.top-right{

top:16px;
right:16px;

border-left:none;
border-bottom:none;

}

.bottom-left{

bottom:16px;
left:16px;

border-right:none;
border-top:none;

}

.bottom-right{

bottom:16px;
right:16px;

border-left:none;
border-top:none;

}

/* ================================
メッセージ
================================ */

#overlay-msg{

position:absolute;

top:10%;

left:50%;

transform:translateX(-50%);

background:rgba(6,10,20,0.9);

padding:10px 14px;

border-radius:12px;

opacity:0;

transition:opacity .2s;

}

#overlay-msg.show{opacity:1;}

/* ================================
下UI
================================ */

.controls{

width:100%;

background:var(--panel-dark);

padding:18px 16px;

display:flex;

flex-direction:column;

align-items:center;

gap:12px;

}

#status-msg{

font-size:.9rem;

color:#9aa3b2;

}

#status-msg.ready{

color:var(--ready-green);

text-shadow:var(--glow-green);

}

#scan-trigger{

width:100%;

max-width:520px;

height:56px;

border-radius:14px;

border:none;

background:linear-gradient(135deg,var(--accent-red),#ff6a88);

color:#fff;

font-weight:800;

font-size:1.05rem;

}

.mode-btn{

width:48px;
height:44px;

border-radius:999px;

border:none;

background:#0c0c12;

color:#fff;

font-size:1.2rem;

}

.back-link{

color:#9aa3b2;

text-decoration:none;

}

/* ================================
モーダル
================================ */

#result-modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.8);

justify-content:center;

align-items:center;

}

.modal-card{

background:#0f1030;

border-radius:20px;

padding:22px;

max-width:520px;

text-align:center;

}

.modal-name{

font-size:2rem;

color:var(--accent-red);

font-weight:900;

margin:10px 0;

}

.modal-cta{

width:100%;

height:56px;

border:none;

border-radius:12px;

background:#00ffd0;

font-weight:800;

}

</style>

</head>

<body>

<div id="reader-wrapper">

<div id="success-flash"></div>
<div id="error-flash"></div>

<div class="hud-corner top-left"></div>
<div class="hud-corner top-right"></div>
<div class="hud-corner bottom-left"></div>
<div class="hud-corner bottom-right"></div>

<div id="reader"></div>

<div id="overlay-msg"></div>

</div>

<div class="controls">

<div id="status-msg">コードを探索中...</div>

<button id="scan-trigger" onclick="pressScan()">
解析を確定する
</button>

<button class="mode-btn" onclick="switchCamera()">🔄</button>

<a href="index.html" class="back-link">CANCEL</a>

</div>

<div id="result-modal">

<div class="modal-card">

<div>DATA ACQUIRED</div>

<div id="modal-name" class="modal-name"></div>

<div id="modal-desc"></div>

<button class="modal-cta" onclick="confirmAndReturn()">
閉じる
</button>

<a href="#" onclick="cancelModal()">キャンセル</a>

</div>

</div>

<script>

/* =============================
変数
============================= */

let html5QrCode;
let cameras=[];
let cameraIndex=0;

let lastResult=null;
let scanArmed=false;

let gameData=null;

/* =============================
初期化
============================= */

window.onload=loadData;

async function loadData(){

const res=await fetch("magics.json");
gameData=await res.json();

cameras=await Html5Qrcode.getCameras();

const back=cameras.findIndex(
c=>/back|rear|environment/i.test(c.label)
);

cameraIndex=back>=0?back:0;

startScanner();

}

/* =============================
スキャナー開始
============================= */

async function startScanner(){

scanArmed=false;

if(html5QrCode)
await html5QrCode.stop().catch(()=>{});

html5QrCode=new Html5Qrcode("reader");

const formats=[

Html5QrcodeSupportedFormats.QR_CODE,

Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.CODE_128,
Html5QrcodeSupportedFormats.CODE_39,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E

];

await html5QrCode.start(

cameras[cameraIndex].id,

{

fps:15,

qrbox:(w,h)=>{

const s=Math.min(w,h)*0.6;

return {width:s,height:s};

},

formatsToSupport:formats,

experimentalFeatures:{
useBarCodeDetectorIfSupported:true
}

},

onScanSuccess

);

enableAutoFocus();

}

/* =============================
フォーカス
============================= */

async function enableAutoFocus(){

try{

const track=html5QrCode.getRunningTrack();

await track.applyConstraints({
advanced:[{focusMode:"continuous"}]
});

}catch(e){}

}

/* =============================
スキャン
============================= */

function onScanSuccess(text){

lastResult=text;

scanArmed=true;

document
.getElementById("status-msg")
.classList.add("ready");

}

/* =============================
確定
============================= */

function pressScan(){

if(!scanArmed){

showOverlay("対象を合わせてください");

return;

}

handleSuccess(lastResult);

}

/* =============================
成功処理
============================= */

function handleSuccess(text){

const clean=text.replace(/\*/g,"");

if(clean.startsWith("MEDIA:")){

const id=clean.split(":")[1];

localStorage.setItem("currentMedia",id);

location.href="index.html";

return;

}

const magic=gameData.magics.find(
m=>m.code===clean
);

if(magic){

showModal(magic.name,magic.desc);

}

}

/* =============================
UI
============================= */

function showOverlay(msg){

const el=document.getElementById("overlay-msg");

el.innerText=msg;

el.classList.add("show");

setTimeout(()=>el.classList.remove("show"),2000);

}

/* =============================
モーダル
============================= */

function showModal(name,desc){

document.getElementById("modal-name").innerText=name;

document.getElementById("modal-desc").innerText=desc;

document.getElementById("result-modal").style.display="flex";

}

function cancelModal(){

document.getElementById("result-modal").style.display="none";

startScanner();

}

function confirmAndReturn(){

location.href="index.html";

}

/* =============================
カメラ切替
============================= */

function switchCamera(){

cameraIndex=(cameraIndex+1)%cameras.length;

startScanner();

}

/* =============================
ServiceWorker
============================= */

if("serviceWorker" in navigator){

navigator.serviceWorker.register("scanner-sw.js");

}

</script>

</body>
</html>
